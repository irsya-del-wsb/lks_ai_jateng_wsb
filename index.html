<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI NLP2SQL Chatbot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark-subtle">

    <div class="container mt-5">
        <h2 class="text-center mb-4">AI NLP2SQL Chatbot Agent</h2>

        <div class="card p-4 shadow">
            <input type="text" id="question" class="form-control mb-3" placeholder="Tanyakan sesuatu...">
            <button onclick="sendQuery()" class="btn btn-primary" type="submit">GO</button>
        </div>

        <div class="mt-4">
            <h5>SQL :</h5>
            <pre id="sqlOutput"></pre>
        </div>

        <div class="mt-4">
            <h5>Data:</h5>
            <table class="table table-bordered" id="tableOutput"></table>
        </div>

        <div class="mt-4">
            <canvas id="chartCanvas"></canvas>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js "></script>

</body>

</html>
